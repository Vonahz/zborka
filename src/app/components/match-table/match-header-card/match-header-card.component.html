<mat-card>
    <div class="flex flex-col md:flex-row justify-between">
        <mat-card-header class="flex">
            <mat-card-title>{{ match().name }}</mat-card-title>
            <mat-card-subtitle>{{
                match().startingTime | firestoreDate | date: 'dd.MM.YY HH:mm'
            }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="flex justify-end">
            <z-google-map />
        </mat-card-content>
    </div>
    <mat-card-actions>
        @if (match().createdByRef.id === currentUserRefId) {
            <button mat-button>EDIT</button>
        }
        <button mat-button>SHARE</button>
    </mat-card-actions>
</mat-card>
